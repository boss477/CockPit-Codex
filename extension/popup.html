<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebMCP Universal Bridge</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
    }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      color: var(--heading);
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 12px;
      font-weight: 600;
      background: rgba(63, 185, 80, 0.15);
      color: var(--ok);
      border: 1px solid rgba(63, 185, 80, 0.4);
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .subtle {
      color: #8b949e;
      font-size: 11px;
    }
    .tools-list {
      margin: 6px 0 0 0;
      padding-left: 18px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      color: var(--accent);
    }
    .tools-list li {
      margin-bottom: 4px;
    }
    button {
      width: 100%;
      background: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2ea043;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <h1>WebMCP Bridge</h1>
    <span class="badge" id="status-badge">ACTIVE</span>
  </header>

  <div class="card">
    <div style="font-weight: 500; color: var(--heading);" id="page-title">Detecting Tab...</div>
    <div class="subtle" id="page-url">Checking active URL...</div>
  </div>

  <div class="card">
    <div style="font-weight: 500; font-size: 12px; color: var(--heading);">Registered Tools:</div>
    <ul class="tools-list" id="tool-items">
      <li>send_message</li>
      <li>search_chats</li>
      <li>get_recent_messages</li>
    </ul>
  </div>

  <button id="test-btn">Test Tool Execution</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
